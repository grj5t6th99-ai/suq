<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUQ — Inventory Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#8A1538; --maroon-deep:#5E0E26; --maroon-tint:#F6E9ED;
  --ink:#14161A; --gypsum:#F1F2EE; --card:#FFF;
  --line:#DEDFD8; --line-soft:#EBECE6;
  --gulf:#0E6E6E; --gulf-tint:#E4F0EF;
  --amber:#A96A08; --amber-tint:#FBF0DE;
  --sand:#B79A5E; --slate:#3A4A5C; --slate-tint:#E7EBEF;
  --muted:#6B6F76; --r:10px;
  --sans:'IBM Plex Sans Arabic','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:var(--gypsum);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font-family:var(--mono);font-size:13px;color:var(--ink)}
.shell{max-width:1280px;margin:0 auto;padding:14px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header + nav */
.mast{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-size:22px;font-weight:700;letter-spacing:-.02em}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.10em;text-transform:uppercase}
.spacer{flex:1}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-weight:500;color:var(--muted)}
.ghost:hover{border-color:var(--ink);color:var(--ink)}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
nav button{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:500;color:var(--muted);white-space:nowrap}
nav button[aria-current="true"]{background:var(--maroon);border-color:var(--maroon);color:#fff}

/* cards + tables */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
.card h2{margin:0;padding:11px 14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line-soft);font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h2 .tag{margin-inline-start:auto;letter-spacing:0;text-transform:none;font-size:11px;font-family:var(--mono);font-weight:500}
.pad{padding:14px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:end;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FAFAF8}
th:first-child{text-align:start}
td{padding:7px 8px;border-bottom:1px solid var(--line-soft);text-align:end;font-family:var(--mono);font-size:13px;white-space:nowrap}
td:first-child{text-align:start;font-family:var(--sans)}
tbody tr:hover{background:#FBFBF9}
tfoot td{border-top:2px solid var(--line);border-bottom:0;font-weight:700}
.pn{font-weight:600;display:block}
.pn+small{color:var(--muted);font-size:11px}
td input,td select{border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:78px;text-align:end;background:#F7F8F5}
td select{width:auto;text-align:start;font-family:var(--sans);font-size:12px}
td input:focus,td select:focus{outline:2px solid var(--maroon);outline-offset:-1px;background:#fff}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.kpi .v{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.kpi .l{font-size:11px;color:var(--muted);margin-top:3px}
.kpi.warn .v{color:var(--amber)} .kpi.bad .v{color:var(--maroon)} .kpi.good .v{color:var(--gulf)}

/* pills */
.p{font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;white-space:nowrap;display:inline-block}
.p-ok{background:var(--gulf-tint);color:var(--gulf)}
.p-warn{background:var(--amber-tint);color:var(--amber)}
.p-bad{background:var(--maroon-tint);color:var(--maroon)}
.p-neutral{background:var(--slate-tint);color:var(--slate)}
.chip{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;font-family:var(--sans);margin-inline-start:5px}
.c-exc{background:var(--amber-tint);color:var(--amber)}
.c-qa{background:var(--maroon-tint);color:var(--maroon)}
.c-gcc{background:var(--gulf-tint);color:var(--gulf)}
.c-res{background:#EEE9F4;color:#5B4B84}

/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:14px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:10px;letter-spacing:.10em;text-transform:uppercase;color:var(--muted);font-weight:600}
.f input,.f select{border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:var(--card);width:100%}
.f input:focus,.f select:focus{outline:2px solid var(--maroon);outline-offset:-1px}
.f .hint{font-size:10px;color:var(--muted);font-family:var(--sans)}
.act{background:var(--maroon);color:#fff;padding:9px 16px;border-radius:8px;font-weight:600}
.act:hover{background:var(--maroon-deep)}
.act:disabled{background:#C9CBC4;cursor:not-allowed}
.act.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.act.sec:hover{background:#F7F8F5;border-color:var(--ink)}
.act.sm{padding:5px 11px;font-size:12px;font-weight:600}
.bar{padding:12px 14px;border-top:1px solid var(--line-soft);display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.bar .spacer{flex:1}

/* cost stack */
.stack{display:flex;height:30px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.stack div{display:grid;place-items:center;color:#fff;font-family:var(--mono);font-size:11px;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:6px}

.note{background:var(--maroon-tint);border-inline-start:3px solid var(--maroon);padding:11px 13px;border-radius:0 8px 8px 0;margin:14px;font-size:13px;line-height:1.5}
.foot{padding:12px 14px;color:var(--muted);font-size:11px;border-top:1px solid var(--line-soft);line-height:1.55}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.gline{height:5px;border-radius:99px;background:var(--line-soft);overflow:hidden;min-width:60px}
.gline i{display:block;height:100%;border-radius:99px}
.toast{position:fixed;inset-block-end:18px;inset-inline-start:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:9px;font-weight:500;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.22);max-width:90vw}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--maroon);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="mast">
    <div class="brand"><b>SUQ</b><span>Inventory Management</span></div>
    <div class="spacer"></div>
    <button class="ghost" id="reset">Reset demo data</button>
  </header>
  <nav id="nav"></nav>
  <main id="view"></main>
  <p class="foot" style="border:0;padding:14px 2px">
    Demo with sample data held in memory — refreshing the page restores the starting state. Figures are illustrative
    and are not tax, customs or pricing advice. Tax position reflects Qatar as at August 2026: no VAT enacted, excise
    live and levied at import.
  </p>
</div>

<script>
"use strict";
/* ============================ helpers ============================ */
const $  = s => document.querySelector(s);
const n2 = v => (Math.round((v||0)*100)/100).toFixed(2);
const n0 = v => Math.round(v||0).toLocaleString("en-US");
const qar = v => "QAR " + n0(v);
const today = () => new Date();
const addDays = d => { const x = new Date(); x.setDate(x.getDate()+d); return x; };
const fmt = dt => dt.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"2-digit"});
const uid = p => p + "-" + Math.random().toString(36).slice(2,7).toUpperCase();
function toast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

const EXCISE = {none:0, carb:.5, energy:1, tobacco:1, special:1};
const EXC_LABEL = {none:"—", carb:"Carbonated 50%", energy:"Energy 100%", tobacco:"Tobacco 100%", special:"Special 100%"};
const ROUTES = {
  sea:{label:"Sea · Hamad Port", lead:28},
  land:{label:"Land · Abu Samra", lead:7},
  air:{label:"Air · HIA", lead:4},
  local:{label:"Local · Qatar", lead:2}
};
const WASTE_REASONS = ["Expired","Damaged in handling","Temperature excursion","Customer return","Preparation waste","Theft / unaccounted"];
const FX = 3.64;

/* ============================ seed data ============================ */
let DB;
function seed(){
  DB = {
    suppliers:[
      {id:"SUP1", name:"Baladna Food Industries",  ar:"بلدنا",        origin:"Qatar",        route:"local", cr:"CR-40219", cert:"Food safety", certDays:88,  terms:"30 days", onTime:96},
      {id:"SUP2", name:"Widam Food Company",       ar:"ودام",         origin:"Qatar",        route:"local", cr:"CR-11884", cert:"Halal",       certDays:212, terms:"45 days", onTime:91},
      {id:"SUP3", name:"Al Rawabi Trading",        ar:"الروابي",       origin:"Saudi Arabia", route:"land",  cr:"CR-77302", cert:"Halal",       certDays:34,  terms:"60 days", onTime:78},
      {id:"SUP4", name:"Sunrise Foods Pvt Ltd",    ar:"صن رايز",       origin:"India",        route:"sea",   cr:"IEC-99120",cert:"Food safety", certDays:151, terms:"LC at sight", onTime:84},
      {id:"SUP5", name:"Gulf Frozen Imports",      ar:"الخليج للمجمدات",origin:"Brazil",      route:"sea",   cr:"CR-55010", cert:"Halal",       certDays:-6,  terms:"30 days", onTime:69}
    ],
    products:[
      {id:"P1", sku:"BEV-COLA-330", en:"Cola Can 330ml",       ar:"كولا ٣٣٠ مل",    cat:"Drinks", uom:"can",  kg:0.36, origin:"Saudi Arabia", exc:"carb",    excBase:1.20, duty:0, res:null,      sup:"SUP3", reorder:1800, retail:2.50},
      {id:"P2", sku:"BEV-NRG-250",  en:"Energy Drink 250ml",   ar:"مشروب طاقة",     cat:"Drinks", uom:"can",  kg:0.30, origin:"Austria",      exc:"energy",  excBase:5.00, duty:5, res:null,      sup:"SUP3", reorder:900,  retail:12.00},
      {id:"P3", sku:"TOB-CIG-20",   en:"Cigarettes 20s",       ar:"سجائر ٢٠",       cat:"Tobacco",uom:"pack", kg:0.03, origin:"Switzerland",  exc:"tobacco", excBase:11.00,duty:5, res:"Age 18+", sup:"SUP3", reorder:400,  retail:25.00},
      {id:"P4", sku:"DRY-RICE-5K",  en:"Basmati Rice 5kg",     ar:"أرز بسمتي ٥ كجم", cat:"Pantry", uom:"bag",  kg:5.20, origin:"India",        exc:"none",    excBase:0,    duty:0, res:null,      sup:"SUP4", reorder:250,  retail:42.00},
      {id:"P5", sku:"DRY-OIL-18",   en:"Sunflower Oil 1.8L",   ar:"زيت دوار الشمس",  cat:"Pantry", uom:"btl",  kg:1.90, origin:"Türkiye",      exc:"none",    excBase:0,    duty:0, res:null,      sup:"SUP4", reorder:220,  retail:19.00},
      {id:"P6", sku:"DRY-DATE-1K",  en:"Khalas Dates 1kg",     ar:"تمر خلاص ١ كجم",  cat:"Pantry", uom:"box",  kg:1.05, origin:"Qatar",        exc:"none",    excBase:0,    duty:0, res:null,      sup:"SUP1", reorder:150,  retail:35.00},
      {id:"P7", sku:"CHL-MILK-1L",  en:"Fresh Milk 1L",        ar:"حليب طازج ١ لتر", cat:"Chilled",uom:"btl",  kg:1.04, origin:"Qatar",        exc:"none",    excBase:0,    duty:0, res:null,      sup:"SUP1", reorder:400,  retail:6.50},
      {id:"P8", sku:"CHL-CHED-1K",  en:"Cheddar Block 1kg",    ar:"جبن شيدر",        cat:"Chilled",uom:"blk",  kg:1.05, origin:"New Zealand",  exc:"none",    excBase:0,    duty:0, res:null,      sup:"SUP4", reorder:80,   retail:46.00},
      {id:"P9", sku:"MET-LAMB-KG",  en:"Lamb Chops",           ar:"ريش غنم",         cat:"Meat",   uom:"kg",   kg:1.00, origin:"Qatar",        exc:"none",    excBase:0,    duty:0, res:"Halal",   sup:"SUP2", reorder:120,  retail:48.00},
      {id:"P10",sku:"FRZ-FRIES-25", en:"Frozen Fries 2.5kg",   ar:"بطاطس مجمدة",     cat:"Frozen", uom:"bag",  kg:2.60, origin:"Belgium",      exc:"none",    excBase:0,    duty:0, res:null,      sup:"SUP5", reorder:180,  retail:28.00}
    ],
    lots:[], pos:[], moves:[], counts:[]
  };
  // opening stock
  const open = [
    ["P1", 5200, 0.92,  290], ["P2", 820, 11.40, 240], ["P3", 260, 23.10, 400],
    ["P4", 640, 27.80,  520], ["P5", 310, 12.60, 300], ["P6", 180, 21.40, 210],
    ["P7", 520, 4.10,     5], ["P8", 88, 31.20,   23], ["P9", 96, 34.50,    9],
    ["P10",310, 19.80,  180]
  ];
  open.forEach(([pid, qty, cost, exp]) => {
    const p = DB.products.find(x => x.id === pid);
    const excU = (EXCISE[p.exc]||0) * p.excBase;
    DB.lots.push({id:uid("LOT"), pid, qty, unitCost:cost, excU, recv:addDays(-30), exp:addDays(exp), grn:"opening"});
    DB.moves.push({id:uid("MV"), date:addDays(-30), type:"Opening", pid, qty, value:qty*cost, ref:"Opening balance"});
  });
  // one PO already sitting in transit, ready to receive
  DB.pos.push({
    id:"PO-2026-0141", sup:"SUP4", status:"In transit", created:addDays(-24), route:"sea", basis:"value",
    charges:{freight:18000, insurance:1400, clearing:4200, inland:1800, demurrage:0},
    lines:[
      {pid:"P4", qty:400, fob:6.20},
      {pid:"P5", qty:300, fob:2.90},
      {pid:"P8", qty:150, fob:7.40}
    ]
  });
}
seed();

const prod = id => DB.products.find(p => p.id === id);
const sup  = id => DB.suppliers.find(s => s.id === id);
const onHand = pid => DB.lots.filter(l => l.pid === pid).reduce((a,l) => a + l.qty, 0);
const stockValue = pid => DB.lots.filter(l => l.pid === pid).reduce((a,l) => a + l.qty * l.unitCost, 0);
const wac = pid => { const q = onHand(pid); return q ? stockValue(pid)/q : 0; };
const exciseHeld = pid => DB.lots.filter(l => l.pid === pid).reduce((a,l) => a + l.qty * (l.excU||0), 0);
const daysTo = d => Math.round((d - today()) / 86400000);

/* ============================ landed cost engine ============================ */
function landed(po){
  const c = po.charges, isLocal = po.route === "local";
  const frt = isLocal ? 0 : (c.freight||0) + (c.insurance||0);
  const other = (c.clearing||0) + (c.inland||0) + (c.demurrage||0);
  const rows = po.lines.map(l => {
    const p = prod(l.pid);
    return {...l, p, fobQ: l.fob * FX * l.qty, wt: p.kg * l.qty, units: l.qty};
  });
  const key = po.basis === "weight" ? "wt" : po.basis === "units" ? "units" : "fobQ";
  const denom = rows.reduce((a,r) => a + r[key], 0) || 1;
  const T = {fob:0, frt:0, duty:0, exc:0, oth:0, total:0};
  rows.forEach(r => {
    const share = r[key] / denom;
    r.frtA = frt * share;
    r.cif  = r.fobQ + r.frtA;
    r.dutyA = isLocal ? 0 : r.cif * (r.p.duty||0) / 100;
    r.othA = other * share;
    const rate = EXCISE[r.p.exc] || 0;
    r.excA = rate * (r.p.excBase||0) * r.qty;
    r.excU = rate * (r.p.excBase||0);
    r.total = r.fobQ + r.frtA + r.dutyA + r.excA + r.othA;
    r.unit  = r.total / (r.qty || 1);
    r.gp    = r.p.retail ? (r.p.retail - r.unit) / r.p.retail * 100 : 0;
    T.fob += r.fobQ; T.frt += r.frtA; T.duty += r.dutyA; T.exc += r.excA; T.oth += r.othA; T.total += r.total;
  });
  return {rows, T};
}
function stackHtml(T){
  const seg = [["var(--slate)",T.fob],["var(--sand)",T.frt],["var(--gulf)",T.duty],["var(--amber)",T.exc],["#8E9299",T.oth]];
  return `<div class="stack">${seg.map(([c,v]) => {
    const pct = T.total ? v/T.total*100 : 0;
    return pct < 0.6 ? "" : `<div style="width:${pct}%;background:${c}" title="${qar(v)}">${pct>8?pct.toFixed(0)+"%":""}</div>`;
  }).join("")}</div>
  <div class="legend">
    <span><i style="background:var(--slate)"></i>Goods ${qar(T.fob)}</span>
    <span><i style="background:var(--sand)"></i>Freight &amp; insurance ${qar(T.frt)}</span>
    <span><i style="background:var(--gulf)"></i>Duty ${qar(T.duty)}</span>
    <span><i style="background:var(--amber)"></i>Excise ${qar(T.exc)}</span>
    <span><i style="background:#8E9299"></i>Clearing &amp; inland ${qar(T.oth)}</span>
  </div>`;
}
function chips(p){
  let s = "";
  if(p.exc !== "none") s += `<span class="chip c-exc">${EXC_LABEL[p.exc]}</span>`;
  if(p.origin === "Qatar") s += `<span class="chip c-qa">Made in Qatar</span>`;
  else if(/Saudi|Emirates|Kuwait|Bahrain|Oman/.test(p.origin)) s += `<span class="chip c-gcc">GCC origin</span>`;
  if(p.res) s += `<span class="chip c-res">${p.res}</span>`;
  return s;
}
function expiryPill(d){
  const k = daysTo(d);
  if(k < 0)  return `<span class="p p-bad">expired</span>`;
  if(k <= 14) return `<span class="p p-bad">${k}d</span>`;
  if(k <= 45) return `<span class="p p-warn">${k}d</span>`;
  return `<span class="p p-ok">${k}d</span>`;
}

/* ============================ views ============================ */
const VIEWS = {};

VIEWS.dashboard = () => {
  const value  = DB.products.reduce((a,p) => a + stockValue(p.id), 0);
  const excise = DB.products.reduce((a,p) => a + exciseHeld(p.id), 0);
  const below  = DB.products.filter(p => onHand(p.id) < p.reorder);
  const risk   = DB.lots.filter(l => daysTo(l.exp) <= 30);
  const riskV  = risk.reduce((a,l) => a + l.qty * l.unitCost, 0);
  const open   = DB.pos.filter(p => p.status !== "Received" && p.status !== "Draft");
  const certs  = DB.suppliers.filter(s => s.certDays < 30);

  return `
  <div class="kpis">
    <div class="kpi"><div class="v">${qar(value)}</div><div class="l">Stock at landed cost</div></div>
    <div class="kpi ${excise/value > .2 ? "warn":""}"><div class="v">${qar(excise)}</div><div class="l">Excise capital held in stock</div></div>
    <div class="kpi ${below.length?"bad":"good"}"><div class="v">${below.length}</div><div class="l">Lines below reorder point</div></div>
    <div class="kpi ${riskV>3000?"warn":""}"><div class="v">${qar(riskV)}</div><div class="l">Value expiring within 30 days</div></div>
    <div class="kpi"><div class="v">${open.length}</div><div class="l">Purchase orders in transit</div></div>
    <div class="kpi ${certs.length?"bad":"good"}"><div class="v">${certs.length}</div><div class="l">Supplier certificates lapsing</div></div>
  </div>

  <section class="card">
    <h2>Needs attention today</h2>
    <div class="scroll"><table>
      <thead><tr><th>Item</th><th>Issue</th><th>Detail</th><th>Action</th></tr></thead>
      <tbody>
      ${certs.map(s => `<tr><td><span class="pn">${s.name}</span><small>${s.ar}</small></td>
        <td><span class="p p-bad">Certificate</span></td>
        <td>${s.cert} ${s.certDays < 0 ? `expired ${Math.abs(s.certDays)}d ago` : `expires in ${s.certDays}d`}</td>
        <td>Block receiving until renewed</td></tr>`).join("")}
      ${risk.slice(0,5).map(l => { const p = prod(l.pid); return `<tr>
        <td><span class="pn">${p.en}</span><small>${l.id}</small></td>
        <td><span class="p ${daysTo(l.exp)<=14?"p-bad":"p-warn"}">Expiry</span></td>
        <td>${n0(l.qty)} ${p.uom} · ${fmt(l.exp)} · ${qar(l.qty*l.unitCost)} at risk</td>
        <td>Mark down or write off</td></tr>`; }).join("")}
      ${below.slice(0,5).map(p => `<tr>

/* -------- purchasing -------- */
let draft = null;
VIEWS.purchasing = () => {
  if(!draft) draft = {id:uid("PO"), sup:"SUP4", status:"Draft", created:today(), route:"sea", basis:"value",
    charges:{freight:0, insurance:0, clearing:0, inland:0, demurrage:0}, lines:[]};
  const s = sup(draft.sup);
  draft.route = s.route;

  return `
  <section class="card">

          <option value="units" ${draft.basis==="units"?"selected":""}>Unit count</option>
        </select><span class="hint">Changes every unit cost</span></div>
      <div class="f"><label>Add a line</label>
        <select data-po="add"><option value="">Choose a product…</option>

/* -------- receiving -------- */
let recvPO = null, recvData = {};
VIEWS.receiving = () => {
  const pending = DB.pos.filter(p => p.status === "In transit");
  if(!recvPO || !pending.some(p => p.id === recvPO)) recvPO = pending[0] ? pending[0].id : null;
  if(!recvPO) return `<section class="card"><h2>Goods receipt</h2>
    <div class="empty"><b>Nothing in transit</b>Raise a purchase order and send it, then come back here to receive it.</div></section>`;

  const po = DB.pos.find(p => p.id === recvPO);
  const s = sup(po.sup), L = landed(po);
  const rule = recvData.rule ?? 75;
  const certBlocked = s.certDays < 0;

  const lines = L.rows.map((r,i) => {
    const d = recvData[i] || (recvData[i] = {qty:r.qty, life:defaultLife(r.p), used:transitUsed(po), temp:defaultTemp(r.p)});
    const remain = d.life ? Math.max(0, (d.life - d.used)/d.life*100) : 100;
    const band = tempBand(r.p);
    const fails = [];
    if(remain < rule) fails.push(`only ${remain.toFixed(0)}% shelf life left (rule ${rule}%)`);
    if(band && (d.temp < band[0] || d.temp > band[1])) fails.push(`received at ${d.temp} °C, outside ${band[0]} to ${band[1]} °C`);
    if(certBlocked) fails.push(`${s.cert} certificate expired ${Math.abs(s.certDays)} days ago`);
    const reject = certBlocked || fails.some(f => /outside/.test(f));
    const verdict = fails.length === 0 ? ["p-ok","ACCEPT"] : reject ? ["p-bad","REJECT"] : ["p-warn","HOLD · CLAIM"];
    d.verdict = verdict[1];
    return {r, i, d, remain, fails, verdict};
  });
  const accepted = lines.filter(l => l.d.verdict === "ACCEPT").length;

  return `
  <section class="card">
    <h2>Goods receipt <span class="tag">${po.id} · ${s.name}</span></h2>
    <div class="form">
      <div class="f"><label>Order</label>
        <select data-recv-po>${pending.map(p => `<option value="${p.id}" ${p.id===recvPO?"selected":""}>${p.id} — ${sup(p.sup).name}</option>`).join("")}</select></div>
      <div class="f"><label>Min shelf life on arrival</label>
        <input type="number" data-recv="rule" value="${rule}" min="0" max="95" step="5">
        <span class="hint">Percent remaining</span></div>
      <div class="f"><label>Supplier certificate</label>
        <input value="${s.cert}: ${s.certDays < 0 ? "EXPIRED" : s.certDays + " days left"}" disabled>
        <span class="hint">${certBlocked ? "Blocks the whole receipt" : "Valid"}</span></div>
    </div>
    ${certBlocked ? `<div class="note"><b>Receiving is blocked.</b> ${s.name}'s ${s.cert.toLowerCase()} certificate
      lapsed ${Math.abs(s.certDays)} days ago. Nothing from this supplier can be brought into stock until it is renewed —
      condition of the goods is irrelevant.</div>` : ""}
    <div class="scroll"><table>
      <thead><tr><th>Product</th><th>Ordered</th><th>Received</th><th>Shelf life</th><th>Days in transit</th><th>Temp °C</th><th>Remaining</th><th>Landed/u</th><th>Verdict</th></tr></thead>
      <tbody>${lines.map(({r,i,d,remain,fails,verdict}) => `<tr>
        <td><span class="pn">${r.p.en}</span><small>${fails.length ? fails.join(" · ") : "Within all limits"}</small></td>
        <td>${n0(r.qty)}</td>
        <td><input type="number" data-rcv="qty" data-i="${i}" value="${d.qty}" style="width:70px"></td>
        <td><input type="number" data-rcv="life" data-i="${i}" value="${d.life}" style="width:66px"></td>
        <td><input type="number" data-rcv="used" data-i="${i}" value="${d.used}" style="width:60px"></td>
        <td>${tempBand(r.p) ? `<input type="number" step="0.1" data-rcv="temp" data-i="${i}" value="${d.temp}" style="width:62px">` : "—"}</td>
        <td>${remain.toFixed(0)}%<div class="gline"><i style="width:${remain}%;background:${remain<rule?"var(--maroon)":remain<rule+15?"var(--amber)":"var(--gulf)"}"></i></div></td>
        <td style="font-weight:600">${n2(r.unit)}</td>
        <td><span class="p ${verdict[0]}">${verdict[1]}</span></td>
      </tr>`).join("")}</tbody>
    </table></div>
    <div class="bar">
      <span class="mono" style="color:var(--muted)">${accepted} of ${lines.length} lines will post to stock</span>
      <span class="spacer"></span>
      <button class="act" data-act="postGRN" ${accepted ? "" : "disabled"}>Post receipt</button>
    </div>
    <div class="foot">
      Shelf-life failures are a supplier claim — the goods are usable, the deal isn't. Temperature and certificate
      failures are refusals. Only accepted lines create stock lots, and each lot carries its own landed cost, so
      average cost moves when this posts.
    </div>
  </section>`;
};
function defaultLife(p){ return {Chilled:180, Meat:120, Frozen:540, Drinks:300, Pantry:730, Tobacco:365}[p.cat] || 365; }
function defaultTemp(p){ return p.cat === "Frozen" ? -19.2 : p.cat === "Chilled" || p.cat === "Meat" ? 3.4 : 0; }
function tempBand(p){ return p.cat === "Frozen" ? [-25,-18] : p.cat === "Chilled" ? [0,5] : p.cat === "Meat" ? [0,4] : null; }
function transitUsed(po){ return ROUTES[po.route].lead + 8; }

/* -------- stock & lots -------- */
VIEWS.stock = () => {
  const lots = DB.lots.slice().sort((a,b) => a.exp - b.exp);
  return `
  <section class="card">
    <h2>Stock by lot <span class="tag">${lots.length} lots · ${qar(DB.products.reduce((a,p)=>a+stockValue(p.id),0))}</span></h2>
    <div class="scroll"><table>
      <thead><tr><th>Lot</th><th>Product</th><th>Qty</th><th>Unit cost</th><th>Value</th><th>Excise in cost</th><th>Received</th><th>Expires</th><th>Left</th><th></th></tr></thead>
      <tbody>${lots.map(l => { const p = prod(l.pid); return `<tr>
        <td><span class="pn">${l.id}</span><small>${l.grn}</small></td>
        <td style="text-align:start;font-family:var(--sans)">${p.en}${chips(p)}</td>
        <td>${n0(l.qty)}</td><td>${n2(l.unitCost)}</td><td>${n0(l.qty*l.unitCost)}</td>
        <td>${l.excU ? n0(l.qty*l.excU) : "—"}</td>
        <td>${fmt(l.recv)}</td><td>${fmt(l.exp)}</td><td>${expiryPill(l.exp)}</td>
        <td>${daysTo(l.exp) <= 45 ? `<button class="act sm sec" data-markdown="${l.id}">Mark down</button>` : ""}</td>
      </tr>`; }).join("")}</tbody>
    </table></div>
    <div class="foot">
      Lots are consumed oldest-expiry-first. Marking down cuts the shelf price on that product by 30% and logs the
      margin given up, which is the honest way to account for it — the loss happened at goods receipt, not at the till.
    </div>
  </section>`;
};

/* -------- adjustments -------- */
let adj = {pid:"P1", qty:1, reason:WASTE_REASONS[0]};
VIEWS.adjustments = () => {

      <tbody>${DB.products.slice(0,6).map(x => {
        const q = onHand(x.id);

          <td><span class="pn">${x.en}</span><small>${x.sku}</small></td>

};

/* -------- reports -------- */
VIEWS.reports = () => {
  const rows = DB.products.map(p => ({p, q:onHand(p.id), v:stockValue(p.id), e:exciseHeld(p.id)}))
    .sort((a,b) => b.v - a.v);
  const total = rows.reduce((a,r) => a + r.v, 0);
  let cum = 0;
  const moves = DB.moves.slice().reverse().slice(0,14);
  return `
  <section class="card">
    <h2>Stock valuation &amp; ABC <span class="tag">${qar(total)} total</span></h2>
    <div class="scroll"><table>
      <thead><tr><th>Product</th><th>Qty</th><th>Avg cost</th><th>Value</th><th>Share</th><th>Cumulative</th><th>Class</th><th>Excise held</th></tr></thead>
      <tbody>${rows.map(r => {
        const share = total ? r.v/total*100 : 0; cum += share;
        const cls = cum <= 70 ? "A" : cum <= 90 ? "B" : "C";
        const col = cls === "A" ? "p-bad" : cls === "B" ? "p-warn" : "p-neutral";
        return `<tr>
          <td><span class="pn">${r.p.en}</span><small>${r.p.cat}</small></td>
          <td>${n0(r.q)}</td><td>${n2(wac(r.p.id))}</td><td>${n0(r.v)}</td>
          <td>${share.toFixed(1)}%</td><td>${cum.toFixed(1)}%</td>
          <td><span class="p ${col}">${cls}</span></td>
          <td>${r.e ? n0(r.e) : "—"}</td>
        </tr>`;
      }).join("")}</tbody>
      <tfoot><tr><td>Total</td><td></td><td></td><td>${n0(total)}</td><td>100%</td><td></td><td></td>
        <td>${n0(rows.reduce((a,r)=>a+r.e,0))}</td></tr></tfoot>
    </table></div>
    <div class="foot">Class A lines are the 70% of stock value you count weekly. In this market they are usually the excise categories, not the fast movers.</div>
  </section>

  <section class="card">
    <h2>Movement ledger <span class="tag">last ${moves.length} of ${DB.moves.length}</span></h2>
    <div class="scroll"><table>
      <thead><tr><th>Reference</th><th>Date</th><th>Type</th><th>Product</th><th>Qty</th><th>Value</th></tr></thead>
      <tbody>${moves.map(m => `<tr>
        <td><span class="pn">${m.ref}</span><small>${m.id}</small></td>
        <td>${fmt(m.date)}</td>
        <td style="text-align:start;font-family:var(--sans)">${m.type}</td>
        <td style="text-align:start;font-family:var(--sans)">${prod(m.pid).en}</td>
        <td style="color:${m.qty<0?"var(--maroon)":"var(--gulf)"}">${m.qty>0?"+":""}${n0(m.qty)}</td>
        <td>${n2(m.value)}</td>
      </tr>`).join("")}</tbody>
    </table></div>
    <div class="foot">Every quantity change writes a row here. Nothing edits stock silently — that is the difference between an inventory system and a spreadsheet.</div>
  </section>`;
};

/* ============================ actions ============================ */
function postGRN(){
  const po = DB.pos.find(p => p.id === recvPO);
  const L = landed(po);
  let n = 0, val = 0;
  L.rows.forEach((r,i) => {
    const d = recvData[i];
    if(!d || d.verdict !== "ACCEPT" || d.qty <= 0) return;
    const grn = uid("GRN");
    DB.lots.push({id:uid("LOT"), pid:r.pid, qty:d.qty, unitCost:r.unit, excU:r.excU,
      recv:today(), exp:addDays(d.life - d.used), grn});
    DB.moves.push({id:uid("MV"), date:today(), type:"Goods receipt", pid:r.pid, qty:d.qty,
      value:d.qty*r.unit, ref:po.id});
    n++; val += d.qty * r.unit;
  });
  po.status = "Received";
  recvPO = null; recvData = {};
  toast(`Posted ${n} line${n===1?"":"s"} · ${qar(val)} added to stock`);
  go("stock");
}
function sendPO(){
  if(!draft.lines.length) return;
  draft.status = "In transit";
  DB.pos.unshift(draft);
  toast(`${draft.id} sent · arrives around ${fmt(addDays(ROUTES[draft.route].lead))}`);
  draft = null;
  render();
}
function postWaste(){
  const p = prod(adj.pid); let need = adj.qty; const cost = wac(adj.pid);
  DB.lots.filter(l => l.pid === adj.pid).sort((a,b) => a.exp - b.exp).forEach(l => {
    if(need <= 0) return;
    const take = Math.min(l.qty, need); l.qty -= take; need -= take;
  });
  DB.lots = DB.lots.filter(l => l.qty > 0.001);
  DB.moves.push({id:uid("MV"), date:today(), type:"Write-off", pid:adj.pid, qty:-adj.qty,
    value:-adj.qty*cost, ref:adj.reason});
  toast(`Wrote off ${n0(adj.qty)} ${p.uom} · ${qar(adj.qty*cost)}`);
  adj.qty = 1; render();
}
function postCount(pid){
  const el = document.querySelector(`[data-count="${pid}"]`);
  const counted = +el.value, sys = onHand(pid), diff = counted - sys, cost = wac(pid);
  if(diff === 0){ toast("No variance to post"); return; }
  if(diff < 0){
    let need = -diff;
    DB.lots.filter(l => l.pid === pid).sort((a,b) => a.exp - b.exp).forEach(l => {
      if(need <= 0) return; const take = Math.min(l.qty, need); l.qty -= take; need -= take;
    });
    DB.lots = DB.lots.filter(l => l.qty > 0.001);
  } else {
    DB.lots.push({id:uid("LOT"), pid, qty:diff, unitCost:cost, excU:0, recv:today(), exp:addDays(120), grn:"count adj"});
  }
  DB.counts.push({pid, date:today(), diff, value:diff*cost});
  DB.moves.push({id:uid("MV"), date:today(), type:"Count adjustment", pid, qty:diff, value:diff*cost, ref:"Cycle count"});
  toast(`Variance ${diff>0?"+":""}${n0(diff)} posted · ${qar(Math.abs(diff*cost))}`);
  render();
}
function markdown(lotId){
  const l = DB.lots.find(x => x.id === lotId); if(!l) return;
  const p = prod(l.pid), was = p.retail;
  p.retail = Math.round(p.retail * 0.7 * 4) / 4;
  DB.moves.push({id:uid("MV"), date:today(), type:"Markdown", pid:l.pid, qty:0,
    value:-(was - p.retail) * l.qty, ref:`${l.id} 30% off`});
  toast(`${p.en} marked down ${n2(was)} → ${n2(p.retail)}`);
  render();
}

/* ============================ router ============================ */
const TABS = [
  ["dashboard","Dashboard"], ["products","Products"], ["suppliers","Suppliers"],
  ["purchasing","Purchasing"], ["receiving","Receiving"], ["stock","Stock & lots"],
  ["adjustments","Waste & counts"], ["reports","Reports"]
];
let current = "dashboard";
function go(t){ current = t; render(); window.scrollTo({top:0,behavior:"instant"}); }
function render(){
  $("#nav").innerHTML = TABS.map(([k,l]) =>
    `<button data-go="${k}" aria-current="${current===k}">${l}</button>`).join("");
  $("#view").innerHTML = VIEWS[current]();
}

/* delegated events */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.go) return go(b.dataset.go);
  if(b.id === "reset"){ seed(); draft = null; recvPO = null; recvData = {}; toast("Demo data reset"); return render(); }
  if(b.dataset.drop !== undefined){ draft.lines.splice(+b.dataset.drop,1); return render(); }
  if(b.dataset.recv){ recvPO = b.dataset.recv; recvData = {}; return go("receiving"); }
  if(b.dataset.markdown) return markdown(b.dataset.markdown);
  if(b.dataset.postCount) return postCount(b.dataset.postCount);
  if(b.dataset.act === "sendPO") return sendPO();
  if(b.dataset.act === "clearPO"){ draft = null; return render(); }
  if(b.dataset.act === "postGRN") return postGRN();
  if(b.dataset.act === "postWaste") return postWaste();
});

document.addEventListener("input", e => {
  const el = e.target, d = el.dataset;
  if(d.edit){ prod(d.id)[d.edit] = +el.value || 0; return softRender(el); }
  if(d.po){
    if(d.po === "sup"){ draft.sup = el.value; draft.lines = []; return render(); }
    if(d.po === "basis"){ draft.basis = el.value; return render(); }
    if(d.po === "add"){ if(el.value){ draft.lines.push({pid:el.value, qty:100, fob:1.00}); render(); } return; }
    draft.charges[d.po] = +el.value || 0; return softRender(el);
  }
  if(d.line){ draft.lines[+d.i][d.line] = +el.value || 0; return softRender(el); }
  if(el.hasAttribute("data-recv-po")){ recvPO = el.value; recvData = {}; return render(); }
  if(d.recv === "rule"){ recvData.rule = +el.value || 0; return softRender(el); }
  if(d.rcv){ recvData[+d.i][d.rcv] = +el.value || 0; return softRender(el); }
  if(d.adj){ adj[d.adj] = d.adj === "qty" ? (+el.value || 0) : el.value; return softRender(el); }
  if(d.count){
    const pid = d.count, diff = (+el.value || 0) - onHand(pid);
    $("#var-"+pid).textContent = (diff>0?"+":"") + n0(diff);
    $("#var-"+pid).style.color = diff < 0 ? "var(--maroon)" : diff > 0 ? "var(--gulf)" : "";
    $("#varv-"+pid).textContent = n2(Math.abs(diff * wac(pid)));
  }
});

/* re-render but keep the caret where it was */
function softRender(el){
  const sel = el.dataset.edit ? `[data-edit="${el.dataset.edit}"][data-id="${el.dataset.id}"]`
            : el.dataset.line ? `[data-line="${el.dataset.line}"][data-i="${el.dataset.i}"]`
            : el.dataset.rcv  ? `[data-rcv="${el.dataset.rcv}"][data-i="${el.dataset.i}"]`
            : el.dataset.po   ? `[data-po="${el.dataset.po}"]`
            : el.dataset.recv ? `[data-recv="${el.dataset.recv}"]`
            : el.dataset.adj  ? `[data-adj="${el.dataset.adj}"]`
            : null;
  render();
  if(!sel) return;
  const again = document.querySelector(sel);
  if(again){ again.focus(); try{ again.setSelectionRange(9999,9999); }catch(_){} }
}

render();
</script>
